<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - LookStylo Clothing</title>
    <script defer src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-900">
    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <img src="slazzer-preview-x2n1h.png" alt="Lookstylo Logo" class="h-16 w-auto object-contain">
                </div>
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="text-gray-700 hover:text-purple-700 font-medium">Home</a>
                    <a href="cart.html" class="text-gray-700 hover:text-purple-700 font-medium">Cart (<span id="cartCount">0</span>)</a>
                    <a href="admin/login.php" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-full font-medium transition">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Opening Soon Banner -->
    <div id="openingBanner" class="bg-gradient-to-r from-orange-500 to-red-600 text-white px-4 py-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex-1">
                <h3 class="font-bold text-lg mb-1">🎉 Sportswear Store Opening Soon!</h3>
                <p class="text-sm">Shop No. 2, Opposite Post Office, Pakkirithakka, Tirupathur Main Road, Jolarpattai – 635853</p>
            </div>
            <div class="flex gap-2">
                <a href="https://www.google.com/maps/search/?api=1&query=Shop+No.+2,+Opposite+Post+Office,+Pakkirithakka,+Tirupathur+Main+Road,+Jolarpattai+635853" target="_blank" rel="noopener noreferrer" class="bg-white text-red-600 font-bold px-4 py-2 rounded hover:bg-gray-100 transition text-sm">
                    View on Map
                </a>
                <button onclick="closeBanner()" class="text-white hover:text-gray-200 text-xl font-bold">
                    ✕
                </button>
            </div>
        </div>
    </div>

    <!-- Shop Section -->
    <section id="products" class="py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-4xl font-bold mb-12 text-center">Our Collections</h1>
            
            <!-- Products Grid -->
            <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Products will be loaded here by JavaScript -->
            </div>
        </div>
    </section>

    <script>
        function closeBanner() {
            document.getElementById('openingBanner').style.display = 'none';
        }
    </script>

    <script>
        async function fetchProducts(){
            try{
                const res = await fetch('/products-api.php');
                const data = await res.json();
                if (data.success) return data.products;
            }catch(e){ console.error(e); }
            return [];
        }

        function formatPrice(n){ return '₹' + n; }

        async function loadProducts(){
            const products = await fetchProducts();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition';
                const img = product.images && product.images.length ? product.images[0] : (product.image || '');
                productCard.innerHTML = `
                    <a href="product.php?id=${product.id}" class="block">
                        <img src="${img}" alt="${product.name}" class="w-full h-48 object-cover" onerror="this.src='https://placehold.co/250x200/301040/ffffff?text=${encodeURIComponent(product.name)}'">
                    </a>
                    <div class="p-4">
                        <h3 class="font-bold text-lg mb-2"><a href="product.php?id=${product.id}" class="hover:underline">${product.name}</a></h3>
                        <p class="text-gray-600 text-sm mb-4">${product.description || ''}</p>
                        <p class="text-purple-700 font-bold text-xl mb-4">${formatPrice(product.price)}</p>
                        <div class="space-y-3 mb-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Size</label>
                                <select class="w-full border border-gray-300 rounded px-3 py-2 size-select text-sm">
                                    ${(product.sizes || 'S,M,L,XL').split(',').map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Color</label>
                                <select class="w-full border border-gray-300 rounded px-3 py-2 color-select text-sm">
                                    <option value="Black">Black</option>
                                    <option value="White">White</option>
                                    <option value="Maroon">Maroon</option>
                                </select>
                            </div>
                        </div>
                        <button class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-2 rounded transition add-to-cart-btn" data-product-id="${product.id}" data-product-name="${product.name}" data-product-price="${product.price}">
                            Add to Cart
                        </button>
                    </div>
                `;
                grid.appendChild(productCard);
            });

            document.querySelectorAll('.add-to-cart-btn').forEach(btn => btn.addEventListener('click', addToCart));
        }

        function addToCart(e){
            const btn = e.target;
            const productId = parseInt(btn.dataset.productId);
            const productName = btn.dataset.productName;
            const productPrice = parseFloat(btn.dataset.productPrice);
            const card = btn.closest('.bg-white');
            const size = card.querySelector('.size-select').value;
            const color = card.querySelector('.color-select').value;
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => item.id === productId && item.size === size && item.color === color);
            if (existing) existing.quantity += 1; else cart.push({ id: productId, name: productName, price: productPrice, size, color, quantity: 1 });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            btn.textContent = '✓ Added to Cart'; btn.disabled = true;
            setTimeout(()=>{ btn.textContent = 'Add to Cart'; btn.disabled = false; }, 1400);
        }

        function updateCartCount(){ const cart = JSON.parse(localStorage.getItem('cart') || '[]'); const c = cart.reduce((s,i)=> s + i.quantity,0); document.getElementById('cartCount').textContent = c; }

        loadProducts(); updateCartCount(); setInterval(updateCartCount, 1000);
    </script>
</body>
</html>
